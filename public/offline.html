<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f2">
    <title>Puzzle Inventory - offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e6e4e1;
            color: #2d2b29;
        }
        .card {
            background: #f5f4f2;
            border: 1px solid #d3d0cc;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 380px;
            text-align: center;
        }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.4em; margin: 16px 0 8px; }
        p { color: #625e5a; line-height: 1.5; margin: 0 0 20px; }
        button {
            background: #4e5d6c;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1f1e1d; color: #ecebe8; }
            .card { background: #2a2927; border-color: #42403d; }
            p { color: #a39e98; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Can't reach the puzzle server</h1>
        <p>Make sure you're on your home Wi-Fi (or VPN), then try again.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
