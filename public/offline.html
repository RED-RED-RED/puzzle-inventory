<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Puzzle Inventory - offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 32px 24px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.4em; margin: 16px 0 8px; }
        p { color: #666; line-height: 1.5; margin: 0 0 20px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            .card { background: #2a2a3e; color: #e0e0f0; }
            p { color: #9999bb; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>Can't reach the puzzle server</h1>
        <p>Make sure you're on your home Wi-Fi (or VPN), then try again.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
